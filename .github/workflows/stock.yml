name: Stock Line Bot

on:
  schedule:
    # รันทุก 5 นาที ในช่วงเวลาตลาดเปิด (ปรับตามความต้องการ)
    - cron: "*/5 14-21 * * 1-5" 
  workflow_dispatch: # กดรันเองได้

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # อนุญาตให้บอทเขียนไฟล์กลับเข้า GitHub ได้
    permissions:
      contents: write 
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run bot
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python bot.py

      - name: Commit and Push State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update stock state [skip ci]" || echo "No changes to commit"
          git push
