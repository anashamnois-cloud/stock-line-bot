name: Stock Line Bot (Always-on Version)

on:
  schedule:
    # รันเวลา 14:25 UTC (หรือ 21:25 น. เวลาไทย) วันจันทร์ - ศุกร์ (ปลุกแค่วันละรอบ)
    - cron: "*/1 13-16 * * 1-5"   # 20:00-23:59 TH
    - cron: "*/1 17-21 * * 2-6"   # 00:00-04:00 TH 
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run bot
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python bot.py

      - name: Commit and Push State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update stock state [skip ci]" || echo "No changes to commit"
          git push
