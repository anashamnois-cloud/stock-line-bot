name: Stock Line Bot
on:
  schedule:
    - cron: "30,35,40,45,50,55 14 * * 1-5"
    - cron: "*/5 15,16 * * 1-5"
    - cron: "*/5 17,18,19,20 * * 2-6"
    - cron: "0 21 * * 2-6"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Load state cache
        uses: actions/cache/restore@v3
        with:
          path: state.json
          key: state-cache-${{ github.run_id }}
          restore-keys: state-cache

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run stock bot
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python bot.py

      - name: Save state cache
        uses: actions/cache/save@v3
        with:
          path: state.json
          key: state-cache-${{ github.run_id }}
